<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>College Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#18202f;--mute:#667085;--line:#e3e7ef;--accent:#2f5bd8;--accent-ink:#fff;--soft:#e8eefc;--warn:#b4561f;--warn-soft:#fbece2;--r:12px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--surface:#171e2e;--ink:#e8ecf5;--mute:#98a2b8;--line:#263049;--accent:#7c9cff;--accent-ink:#0b1020;--soft:#1e2a4d;--warn:#f0a070;--warn-soft:#3a271c}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "DM Sans",system-ui,sans-serif}
h1,h2{font-family:"Source Serif 4",Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.wrap{max-width:920px;margin:0 auto;padding:0 20px 64px}
header{display:flex;align-items:center;gap:20px;padding:22px 0 14px;flex-wrap:wrap}
.logo{font-family:"Source Serif 4",Georgia,serif;font-size:20px;font-weight:600;margin-right:auto}
nav{display:flex;gap:4px}
nav button{font:inherit;border:0;background:none;color:var(--mute);padding:7px 14px;border-radius:99px;cursor:pointer}
nav button:hover{color:var(--ink)}
nav button.on{background:var(--ink);color:var(--bg)}
.head{margin:28px 0 18px}
.head h2{font-size:30px}
.head p{color:var(--mute);margin:4px 0 0}
.search{width:100%;font:inherit;font-size:16px;padding:14px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:none;color:var(--mute);padding:4px 12px;border-radius:99px;cursor:pointer}
.chip.on{background:var(--soft);border-color:transparent;color:var(--accent);font-weight:600}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.row{display:flex;align-items:center;gap:16px;padding:14px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.main{flex:1;min-width:0}
.t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{color:var(--mute);font-size:13px}
.pips{display:flex;gap:4px;align-items:center;justify-content:flex-end;min-width:90px}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--accent)}
.pip.f{background:var(--accent)}
.avail{font-size:13px;color:var(--mute);width:84px;text-align:right}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;border-radius:99px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{opacity:.9;color:var(--accent-ink)}
.btn.sm{padding:4px 9px;font-size:12px}
.late{color:var(--warn);font-weight:600;font-size:13px}
.tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--soft);color:var(--accent)}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.g{background:var(--line);color:var(--mute)}
.issue{display:flex;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:24px}
.issue select{flex:1;min-width:160px;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.sum{display:flex;gap:28px;margin:0 0 22px;flex-wrap:wrap}
.sum b{font-family:"Source Serif 4",Georgia,serif;font-size:26px;display:block;line-height:1.1}
.sum span{color:var(--mute);font-size:13px}
.sum .w b{color:var(--warn)}
h3{font-size:14px;color:var(--mute);font-weight:600;margin:26px 0 8px}
.empty{padding:36px 18px;text-align:center;color:var(--mute)}
#toast{display:none;z-index:200}
.toast,#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:9}
#toast{left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--warn);color:#fff}
.login-shell{min-height:calc(100vh - 24px);display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,440px);gap:clamp(28px,6vw,84px);align-items:center;max-width:1040px;margin:0 auto;padding:40px 20px 64px}
.login-brand{position:relative;min-height:420px;display:flex;flex-direction:column;justify-content:center;padding:30px 12px;color:var(--ink)}
.brand-mark{width:76px;height:76px;display:grid;place-items:center;border-radius:24px;background:var(--soft);color:var(--accent);margin-bottom:22px}
.brand-mark svg{width:44px;height:44px}
.login-brand h1{font:600 clamp(34px,4vw,48px)/1.08 "Source Serif 4",Georgia,serif;letter-spacing:-.03em;max-width:480px}
.login-brand .tagline{font-size:19px;color:var(--accent);font-weight:600;letter-spacing:.02em;margin:14px 0 8px}
.login-brand .brand-copy{max-width:390px;color:var(--mute);font-size:16px;line-height:1.8;margin:4px 0 0}
.brand-rule{width:56px;height:4px;background:var(--accent);border-radius:9px;margin-top:28px}
.login{width:100%;max-width:440px;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(24px,3vw,36px);box-shadow:0 20px 60px rgba(27,54,105,.10)}
.login .login-icon{width:58px;height:58px;border-radius:18px;background:var(--accent);color:#fff;display:grid;place-items:center;margin:0 auto 16px}
.login .login-icon svg{width:32px;height:32px}
.login h2{text-align:center;font:600 28px/1.2 "Source Serif 4",Georgia,serif}
.login .login-sub{text-align:center;color:var(--mute);margin:8px 0 24px}
.login .seg.full{padding:4px;background:var(--bg);border-color:var(--line);margin:0 0 22px;display:flex}
.login .seg.full button{flex:1;padding:10px 12px;font-weight:600;color:var(--mute);border:0;background:none;cursor:pointer;border-radius:99px}
.login .seg.full button.on{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px rgba(20,50,100,.12)}
.login label{display:block;font-size:13px;font-weight:600;margin:16px 0 7px;color:var(--ink)}
.login input{width:100%;font:inherit;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.login input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);outline:none}
.login .btn{width:100%;margin-top:22px;padding:13px 16px;border-radius:11px;font-size:15px}
.login .hintbox{margin-top:20px;font-size:12px;line-height:1.65;color:var(--mute);background:var(--bg);padding:12px 14px;border:1px solid var(--line);border-radius:10px}
.login .hint-title{font-weight:700;color:var(--ink);display:block;margin-bottom:2px}
.login .err{padding:10px 12px;background:var(--warn-soft);border-radius:8px}
@media(max-width:760px){.login-shell{grid-template-columns:1fr;gap:18px;max-width:500px;padding:24px 18px 48px;align-content:center}.login-brand{min-height:0;padding:10px 4px 6px;text-align:center;align-items:center}.brand-mark{width:58px;height:58px;border-radius:18px;margin-bottom:14px}.login-brand h1{font-size:34px}.login-brand .tagline{font-size:16px;margin:8px 0 2px}.login-brand .brand-copy,.brand-rule{display:none}.login{max-width:none;padding:24px}}
@media(prefers-reduced-motion:no-preference){.login{animation:login-in .35s ease-out}@keyframes login-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.tile b{display:block;font:600 30px/1.1 "Source Serif 4",Georgia,serif}
.tile>span{color:var(--mute);font-size:13px}
.tile small{display:block;margin-top:6px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.w b{color:var(--warn)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:var(--r);padding:14px 18px;margin-bottom:22px;font-weight:600}
.banner.ok{background:var(--soft);color:var(--accent)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 8px}
.sec h3{margin:0}
.link{font:inherit;font-size:13px;border:0;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:0}
.split{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);margin:4px 0 12px}
.split i{display:block}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
@media print{header,.issue,.btn,.link,#toast{display:none!important}body{background:#fff}}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute)}
header[hidden]{display:none}

/* Modal Styles */
.modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; }
.modal-content { background:var(--surface); padding:24px; border-radius:var(--r); width:100%; max-width:400px; box-shadow:0 10px 25px rgba(0,0,0,0.2); }
.modal-content h3 { margin-top:0; }
.modal-content form { display:grid; gap:12px; }
.modal-content label { font-size:13px; font-weight:600; margin-bottom:-8px; }
.modal-content input, .modal-content select { padding:10px; border:1px solid var(--line); border-radius:8px; }
.modal-footer { display:flex; justify-content:flex-end; gap:8px; margin-top:20px; }
</style>
</head>
<body>
<div class="wrap">
  <header id="top">
    <div class="logo">College Library</div>
    <nav id="nav"></nav>
    <div class="who" id="who"></div>
  </header>
  <main id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
// --- 1. Backend API Helper ---
async function api(endpoint, method = 'GET', body = null) {
    const headers = { 'Content-Type': 'application/json' };
    const token = localStorage.getItem('token');
    if (token) headers['Authorization'] = `Bearer ${token}`;
    const config = { method, headers };
    if (body) config.body = JSON.stringify(body);
    const res = await fetch(`http://localhost:3000${endpoint}`, config);
    if (res.status === 401) { localStorage.removeItem('token'); location.reload(); }
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Server error');
    return data;
}

// --- 2. Global State & Helpers ---
let state = { user: null, tab: 'dashboard', mode: 'Student' };
let BOOKS = [], LOANS = [], MEMBERS = [], HISTORY = [];
let PESO = 5;

const $ = id => document.getElementById(id);
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = () => { const d = new Date(); d.setHours(12,0,0,0); return d; };
const fmt = d => d ? new Date(d).toLocaleDateString('en-PH',{month:'short',day:'numeric'}) : '—';
const days = (a,b) => Math.round((a-b)/864e5);
const late = l => Math.max(0, days(today(), l.due));

function toast(msg, err) {
    const t = $('toast');
    t.textContent = msg;
    t.style.background = err ? 'var(--warn)' : 'var(--ink)';
    t.style.color = err ? '#fff' : 'var(--bg)';
    t.style.display = 'block';
    clearTimeout(toast.h);
    toast.h = setTimeout(() => t.style.display = 'none', 3500);
}

const book = id => BOOKS.find(b => String(b.id) === String(id));
const mem = id => MEMBERS.find(m => String(m.id) === String(id) || String(m.member_code) === String(id));
const avail = b => b ? b.available : 0;
const tot = b => b ? b.copies : 0;

const isStaff = () => state.user && ['Librarian', 'System Administrator'].includes(state.user.role);
const isAdmin = () => state.user && state.user.role === 'System Administrator';

function tabs() {
    if (isAdmin()) return [['dashboard','Dashboard'],['overdue','Overdue'],['reports','Reports'],['users','Users'],['catalog','Catalog'],['loans','Loans'],['members','Members']];
    if (isStaff()) return [['dashboard','Dashboard'],['overdue','Overdue'],['reports','Reports'],['catalog','Catalog'],['loans','Loans'],['members','Members']];
    return [['dashboard','Home'],['catalog','Catalog'],['loans','My loans'],['history','My History']];
}

// --- 3. Data Sync ---
async function syncFromServer() {
    try {
        BOOKS = await api('/api/books');
        LOANS = await api('/api/loans');
        if (isStaff()) MEMBERS = await api('/api/members');
        if (state.user) HISTORY = await api('/api/history');
    } catch(e) { console.error('Sync failed', e); toast('Could not load data: ' + e.message, 1); }
}

// --- 4. Actions ---
async function handleCatalogClick(e, el) {
    const bid = el.dataset.bookId;
    if (isStaff()) {
        state.tab = 'loans';
        render();
        setTimeout(() => {
            const bookSelect = $('issueBook');
            if (bookSelect) bookSelect.value = bid;
            toast(`Selected ${book(bid).title} for issuing.`);
        }, 50);
    } else {
        toast(`To borrow "${book(bid).title}", please ask the librarian.`);
    }
}

function filterCatalog(q) {
    q = q.toLowerCase();
    document.querySelectorAll('[data-book-id]').forEach(r => r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none');
}

async function issue(mid, bid) {
    const m = mem(mid), b = book(bid);
    if (!m || !b) return toast('Choose a member and a book.', 1);
    try {
        const free = await api(`/api/books/${bid}/copies`);
        if (!free.length) return toast('No copies are available right now.', 1);
        await api('/api/loans', 'POST', { memberId: m.id || m.member_id, copyId: free[0].id });
        await syncFromServer();
        toast(`Issued to ${m.full_name || m.name}.`);
        render();
    } catch(err) { toast(err.message, 1); }
}

async function addBook(data) {
    try {
        await api('/api/books', 'POST', data);
        await syncFromServer();
        toast('Book added successfully!');
        render();
    } catch(err) { toast(err.message, 1); }
}

async function addCopies(bookId) {
    const count = prompt('How many copies to add?');
    if (!count || isNaN(count)) return;
    try {
        await api('/api/book-copies', 'POST', { bookId, count });
        await syncFromServer();
        toast('Copies added!');
        render();
    } catch(err) { toast(err.message, 1); }
}

async function addMember(data) {
    try {
        await api('/api/members', 'POST', data);
        await syncFromServer();
        toast('Member registered!');
        render();
    } catch(err) { toast(err.message, 1); }
}

async function giveBack(id) {
    try {
        const r = await api(`/api/loans/${id}/return`, 'POST');
        await syncFromServer();
        toast(r.daysLate > 0 ? `Returned late. Fine: ₱${r.fine}.` : 'Returned on time.');
        render();
    } catch(err) { toast(err.message, 1); }
}

async function renewLoan(id) {
    try {
        const r = await api(`/api/loans/${id}/renew`, 'POST');
        await syncFromServer();
        toast(`Renewed! New due date: ${fmt(r.newDueDate)}.`);
        render();
    } catch(err) { toast(err.message, 1); }
}

// --- 5. Views ---
const pips = b => `<span class="pips">${Array.from({length: tot(b)}, (_,i) => `<i class="pip${i < avail(b) ? ' f' : ''}"></i>`).join('')}</span>`;

async function render() {
    const top = $('top'), view = $('view');
    if (!state.user) {
        top.hidden = true;
        view.innerHTML = `
            <section class="login-shell">
                <div class="login-brand">
                    <div class="brand-mark"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M24 13c-5-5-11-5-17-3v25c6-2 12-2 17 3 5-5 11-5 17-3V10c-6-2-12-2-17 3Z"/><path d="M24 13v25M11 15v15M37 15v15"/></svg></div>
                    <h1>College Library</h1><p class="tagline">Learn · Research · Grow</p>
                    <p class="brand-copy">Your gateway to knowledge, resources, and a brighter future.</p>
                </div>
                <form class="login" id="loginForm">
                    <h2>Welcome back</h2><p class="login-sub">Sign in to continue</p>
                    <div class="seg full">
                        ${['Student','Librarian','Administrator'].map(m => `<button type="button" data-mode="${m}" class="${state.mode===m?'on':''}">${m}</button>`).join('')}
                    </div>
                    <label>Email</label><input id="email" type="email" placeholder="student@example.edu" required>
                    <label>Password</label><input id="password" type="password" placeholder="••••••••" required>
                    <div id="loginError" style="color:var(--warn);font-size:13px;margin-top:10px;"></div>
                    <button class="btn p" type="submit">Sign in</button>
                    ${state.mode === 'Student' ? '<div class="hintbox"><span class="hint-title">Demo Accounts</span><br>Student: student@example.edu / student123<br>Librarian: librarian@example.edu / lib123<br>Admin: admin@example.edu / admin123</div>' : ''}
                </form>
            </section>`;
        return;
    }

    top.hidden = false;
    $('who').innerHTML = `<span>${esc(state.user.full_name)} (${esc(state.user.role)})</span><button class="btn" id="logoutBtn">Sign out</button>`;
    $('logoutBtn').onclick = () => { localStorage.removeItem('token'); state.user = null; render(); };

    $('nav').innerHTML = tabs().map(([k,l]) => `<button data-tab="${k}" class="${state.tab===k?'on':''}">${l}</button>`).join('');
    document.querySelectorAll('#nav button').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; render(); });

    const views = { dashboard: dashView, catalog: catView, loans: loansView, members: memView, history: histView, users: usersView, overdue: overdueView, reports: reportsView, settings: setView };

    let content = '';
    const viewFn = views[state.tab] || dashView;

    if (typeof viewFn === 'function') {
        // Some views are async (overdueView, reportsView), some are not.
        // We handle both by wrapping in Promise.resolve()
        content = await Promise.resolve(viewFn());
    }

    view.innerHTML = content;

    document.querySelectorAll('[data-ret]').forEach(b => b.onclick = () => giveBack(b.dataset.ret));
    document.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => renewLoan(b.dataset.renew));
    document.querySelectorAll('[data-add-copy]').forEach(b => b.onclick = () => addCopies(b.dataset.addCopy));

    const issueBtn = $('goIssue');
    if (issueBtn) issueBtn.onclick = () => issue($('issueMember').value, $('issueBook').value);

    if (isStaff()) {
        const bBtn = $('openBookModal');
        if (bBtn) bBtn.onclick = () => {
            const m = document.createElement('div');
            m.className = 'modal';
            m.innerHTML = `
                <div class="modal-content">
                    <h3>Add New Book</h3>
                    <form id="bookForm">
                        <label>Title</label><input id="btitle" required>
                        <label>Author</label><input id="bauthor" required>
                        <label>ISBN</label><input id="bisbn">
                        <label>Category</label><input id="bcat">
                        <div class="modal-footer">
                            <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
                            <button type="submit" class="btn p">Save Book</button>
                        </div>
                    </form>
                </div>`;
            document.body.appendChild(m);
            $('bookForm').onsubmit = async (e) => {
                e.preventDefault();
                await addBook({
                    title: $('btitle').value, author: $('bauthor').value,
                    isbn: $('bisbn').value, category: $('bcat').value
                });
                m.remove();
            };
        };

        const mBtn = $('openMemModal');
        if (mBtn) mBtn.onclick = () => {
            const m = document.createElement('div');
            m.className = 'modal';
            m.innerHTML = `
                <div class="modal-content">
                    <h3>Register Member</h3>
                    <form id="memForm">
                        <label>Full Name</label><input id="mname" required>
                        <label>Email</label><input id="memail" type="email" required>
                        <label>Type</label>
                        <select id="mtype">
                            <option>Student</option><option>Faculty</option><option>Staff</option>
                        </select>
                        <label>Department</label><input id="mdept">
                        <div class="modal-footer">
                            <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
                            <button type="submit" class="btn p">Register</button>
                        </div>
                    </form>
                </div>`;
            document.body.appendChild(m);
            $('memForm').onsubmit = async (e) => {
                e.preventDefault();
                await addMember({
                    full_name: $('mname').value, email: $('memail').value,
                    member_type: $('mtype').value, program_department: $('mdept').value
                });
                m.remove();
            };
        };
    }
}

function dashView() {
    const od = LOANS.filter(l => l.is_overdue).length;
    return `
        <div class="head"><h2>Welcome, ${esc(state.user.full_name)}</h2><p>You are signed in as ${esc(state.user.role)}.</p></div>
        <div class="tiles">
            <div class="tile"><b>${LOANS.length}</b><span>Active Loans</span></div>
            <div class="tile ${od?'w':''}"><b>${od}</b><span>Overdue</span></div>
            <div class="tile"><b>${BOOKS.length}</b><span>Book Titles</span></div>
        </div>`;
}

function catView() {
    return `
        <div class="head">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h2>Catalog</h2>
                    <p>Search the collection.</p>
                </div>
                ${isStaff() ? `<button class="btn p" id="openBookModal">+ Add Book</button>` : ''}
            </div>
        </div>
        <input class="search" placeholder="Search titles..." oninput="filterCatalog(this.value)">
        <div class="list">
            ${BOOKS.map(b => `
                <div class="row" style="cursor:pointer" data-book-id="${b.id}" onclick="${isStaff() ? 'handleCatalogClick(event, this)' : 'handleCatalogClick(event, this)'}">
                    <div class="main"><div class="t">${esc(b.title)}</div><div class="s">${esc(b.author)}</div></div>
                    ${pips(b)}<span class="avail">${avail(b)} / ${tot(b)}</span>
                    ${isStaff() ? `<button class="btn sm" data-add-copy="${b.id}" onclick="event.stopPropagation(); addCopies('${b.id}')">+ Copy</button>` : ''}
                </div>`).join('')}
        </div>`;
}

function loansView() {
    const mine = isStaff() ? LOANS : LOANS.filter(l => l.member_id === state.user.member_id);
    const form = isStaff() ? `
        <div class="issue">
            <select id="issueMember"><option value="">Member</option>${MEMBERS.map(m => `<option value="${m.id}">${esc(m.full_name)}</option>`).join('')}</select>
            <select id="issueBook"><option value="">Book</option>${BOOKS.map(b => `<option value="${b.id}">${esc(b.title)}</option>`).join('')}</select>
            <button class="btn p" id="goIssue">Issue</button>
        </div>` : '';
    return `
        <div class="head"><h2>${isStaff()?'Loans':'My Loans'}</h2><p>Current active loans.</p></div>
        ${form}
        <div class="list">
            ${mine.map(l => `
                <div class="row">
                    <div class="main"><div class="t">${esc(l.title)}</div><div class="s">${esc(l.member_name)} · Due ${fmt(l.due_date)}</div></div>
                    <div class="tag ${l.is_overdue?'w':''}">${l.is_overdue ? l.days_overdue_now+' days late' : 'On time'}</div>
                    ${isStaff()?`<button class="btn" data-ret="${l.transaction_id}">Return</button>`:`<button class="btn" data-renew="${l.transaction_id}">Renew</button>`}
                </div>`).join('') || '<div class="row">No active loans.</div>'}
        </div>`;
}

function memView() {
    return `
        <div class="head">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div>
                    <h2>Members</h2>
                    <p>Registered users.</p>
                </div>
                ${isStaff() ? `<button class="btn p" id="openMemModal">+ Add Member</button>` : ''}
            </div>
        </div>
        <div class="list">
            ${MEMBERS.map(m => `<div class="row"><div class="main"><div class="t">${esc(m.full_name)}</div><div class="s">${esc(m.member_code)}</div></div></div>`).join('')}
        </div>`;
}

function histView() {
    return `
        <div class="head"><h2>Transaction History</h2><p>Past loans.</p></div>
        <div class="list">
            ${HISTORY.filter(h => h.status === 'Returned').map(h => `<div class="row"><div class="main"><div class="t">${esc(h.title)}</div><div class="s">Returned ${fmt(h.returned_at)}</div></div></div>`).join('') || '<div class="row">No past loans.</div>'}
        </div>`;
}

async function overdueView() {
    let data = [];
    try { data = await api('/api/overdue'); } catch(e) { data = []; }

    return `
        <div class="head"><h2>Overdue Books</h2><p>Active loans past their due date.</p></div>
        <div class="list">
            ${data.map(l => `
                <div class="row">
                    <div class="main"><div class="t">${esc(l.title)}</div><div class="s">${esc(l.member_name)} · Due ${fmt(l.due_date)}</div></div>
                    <div class="tag w">${l.days_overdue_now} days late</div>
                    <div class="s">Fine: ₱${l.projected_fine}</div>
                </div>`).join('') || '<div class="row">Nothing is overdue.</div>'}
        </div>`;
}

async function reportsView() {
    const start = '2026-10-01', end = '2026-10-27';
    let data = {};
    try { data = await api(`/api/reports?start=${start}&end=${end}`); } catch(e) { data = {}; }

    return `
        <div class="head"><h2>Library Reports</h2><p>Summary for ${start} to ${end}.</p></div>
        <div class="tiles">
            <div class="tile"><b>${data.books_borrowed || 0}</b><span>Books Borrowed</span></div>
            <div class="tile"><b>${data.books_returned || 0}</b><span>Books Returned</span></div>
            <div class="tile"><b>${data.active_loans || 0}</b><span>Active Loans</span></div>
            <div class="tile w"><b>${data.overdue_now || 0}</b><span>Overdue Now</span></div>
        </div>`;
}

function usersView() {
    return `
        <div class="head"><h2>Manage Users</h2><p>Change user roles and permissions.</p></div>
        <div class="list">
            ${state.user && state.user.role === 'System Administrator' ? `
                <div class="issue" style="margin-bottom:20px">
                    <input id="newUserName" placeholder="Full Name" style="flex:1">
                    <input id="newUserEmail" type="email" placeholder="Email" style="flex:1">
                    <select id="newUserRole">
                        <option>Student</option>
                        <option>Librarian</option>
                        <option>System Administrator</option>
                    </select>
                    <button class="btn p" id="saveNewUser">Create User</button>
                </div>
            ` : '<div class="banner">Only System Administrators can manage users.</div>'}
            <div class="list">
                <div class="row">
                    <div class="main"><div class="t">student@example.edu</div><div class="s">Current Role: Student</div></div>
                    <span class="tag">Student</span>
                </div>
                <div class="row">
                    <div class="main"><div class="t">librarian@example.edu</div><div class="s">Current Role: Librarian</div></div>
                    <span class="tag">Librarian</span>
                </div>
                <div class="row">
                    <div class="main"><div class="t">admin@example.edu</div><div class="s">Current Role: System Administrator</div></div>
                    <span class="tag">Admin</span>
                </div>
            </div>
        </div>`;
}
function setView() { return `<div class="head"><h2>Settings</h2><p>Settings placeholder.</p></div>`; }

// --- 6. Events ---
document.addEventListener('click', e => {
    if (e.target.dataset.mode) {
        state.mode = e.target.dataset.mode;
        render();
    }
});

document.addEventListener('submit', async e => {
    if (e.target.id !== 'loginForm') return;
    e.preventDefault();
    const errDiv = $('loginError');
    try {
        errDiv.textContent = 'Signing in...';
        const data = await api('/api/login', 'POST', { email: $('email').value, password: $('password').value });
        localStorage.setItem('token', data.token);
        state.user = await api('/api/me');
        await syncFromServer();
        errDiv.textContent = '';
        render();
    } catch (err) {
        console.error('Login Error:', err);
        errDiv.textContent = 'Login failed: ' + err.message;
    }
});

// --- 7. Auto-Login ---
(async function init() {
    if (localStorage.getItem('token')) {
        try {
            state.user = await api('/api/me');
            await syncFromServer();
        } catch(e) { localStorage.removeItem('token'); }
    }
    render();
})();
</script>
</body>
</html>
